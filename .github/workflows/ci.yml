name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # Os testes de ControleDeGastos.Api.DatabaseTests exercitam a traducao SQL das
    # consultas por competencia, entao precisam de um SQL Server de verdade. Na maquina
    # de desenvolvimento eles caem no LocalDB; aqui, neste container.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Dev@Password123"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Dev@Password123' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore -c Release
        working-directory: backend

      # Inclui os testes de arquitetura: a fronteira entre modulos e verificada aqui.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
        working-directory: backend
        env:
          ConnectionStrings__Database: "Server=localhost,1433;Database=ControleDeGastos_IntegrationTests;User Id=sa;Password=Dev@Password123;TrustServerCertificate=True;MultipleActiveResultSets=True"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadless
        working-directory: frontend

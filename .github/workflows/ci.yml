name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Dev@Password123
          POSTGRES_DB: controledegastos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Sem cache de NuGet: o `cache: true` do setup-dotnet exige packages.lock.json,
      # que este repositorio nao usa, e falha quando o glob nao casa nada. Para ligar,
      # rode antes `dotnet restore --use-lock-file` e versione os lock files.
      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore -c Release
        working-directory: backend

      # Inclui os testes de arquitetura: a fronteira entre modulos e verificada aqui.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
        working-directory: backend
        env:
          ConnectionStrings__Database: "Host=localhost;Port=5432;Database=controledegastos_integrationtests;Username=postgres;Password=Dev@Password123"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadless
        working-directory: frontend

  # Constroi as duas imagens sem publicar nada. So assim os Dockerfiles continuam
  # validos: um Dockerfile que ninguem constroi quebra em silencio e so aparece na
  # hora do deploy, que e o pior momento possivel.
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: controle-gastos-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build da imagem do front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: controle-gastos-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

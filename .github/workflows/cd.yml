
# Deploy. Parametrizado e INERTE ate voce preencher os secrets do environment:
# o job de publicacao checa se o registry esta configurado e para com uma mensagem
# util em vez de falhar no meio, se nao estiver.
#
# Por que disparo manual (workflow_dispatch) e nao push em main: enquanto a aplicacao
# nao tem login (ver docs/deploy.md), deploy automatico a cada commit e a receita
# para expor dados sem querer. Quando a autenticacao entrar, troque por:
#
#   on:
#     push:
#       branches: [main]
#
# Vindo do Azure DevOps, o mapeamento e:
#   Stage            -> job + needs:
#   Variable Group   -> Environment (variables e secrets)
#   Approval         -> Environment com required reviewers
#   Service Connection -> credencial federada OIDC (permissions.id-token: write)

name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        type: environment
        required: true
        default: staging

concurrency:
  # Dois deploys simultaneos no mesmo ambiente aplicariam migrations em paralelo.
  group: cd-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write   # necessario para OIDC; inofensivo enquanto nao ha cloud ligada

jobs:
  # ---------------------------------------------------------------------------
  # 1. Portao: o CD nunca publica algo que nao passou pelo CI.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Dev@Password123
          POSTGRES_DB: controledegastos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testes do back-end
        run: dotnet test -c Release --verbosity minimal
        working-directory: backend
        env:
          ConnectionStrings__Database: "Host=localhost;Port=5432;Database=controledegastos_integrationtests;Username=postgres;Password=Dev@Password123"

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Testes do front-end
        run: npm ci && npx ng test --watch=false --browsers=ChromeHeadless
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # 2. Publica as imagens no GitHub Container Registry (ghcr.io).
  #    Escolhido como default por nao exigir nuvem nenhuma: o proprio GitHub
  #    hospeda, e a autenticacao sai do GITHUB_TOKEN. Trocar por ACR/Docker Hub
  #    depois e so mudar o registry e o login.
  # ---------------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: verify
    environment: ${{ inputs.environment }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag da imagem
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Publicar imagem do front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ---------------------------------------------------------------------------
  # 3. Migrations como passo EXPLICITO, antes de trocar a versao da aplicacao.
  #    E por isso que Database:AutoMigrate fica false em producao: duas instancias
  #    subindo juntas disputariam o lock, e um rollback de app nao reverte schema.
  # ---------------------------------------------------------------------------
  migrate:
    runs-on: ubuntu-latest
    needs: publish
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se o ambiente esta configurado
        id: guard
        run: |
          if [ -z "${{ secrets.DATABASE_CONNECTION_STRING }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy nao configurado::Defina o secret DATABASE_CONNECTION_STRING no environment '${{ inputs.environment }}'. Veja docs/deploy.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Aplicar migrations dos 5 modulos
        if: steps.guard.outputs.configured == 'true'
        working-directory: backend
        env:
          ConnectionStrings__Database: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          dotnet tool restore
          for m in \
            "Ledger:LedgerDbContext" \
            "Budgeting:BudgetingDbContext" \
            "Recurrences:RecurrencesDbContext" \
            "Categorization:CategorizationDbContext" \
            "Banking:BankingDbContext"
          do
            module="${m%%:*}"
            context="${m##*:}"
            echo "==> $module ($context)"
            # Um DbContext e um historico de migrations por modulo: dai o loop.
            DOTNET_ROLL_FORWARD=LatestMajor dotnet dotnet-ef database update \
              --project "src/Modules/$module/ControleDeGastos.Modules.$module" \
              --startup-project src/Api/ControleDeGastos.Api \
              --context "$context"
          done

  # ---------------------------------------------------------------------------
  # 4. Deploy propriamente dito. Sem host escolhido ainda: o passo abaixo imprime
  #    as instrucoes em vez de falhar. Descomente o bloco do seu provedor quando
  #    decidir - as imagens ja estarao no ghcr.io, prontas para qualquer um deles.
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [publish, migrate]
    environment: ${{ inputs.environment }}
    steps:
      - name: Publicar destino
        run: |
          TAG="${{ needs.publish.outputs.image-tag }}"
          echo "Imagens disponiveis:"
          echo "  ghcr.io/${{ github.repository }}/api:$TAG"
          echo "  ghcr.io/${{ github.repository }}/web:$TAG"
          echo ""
          echo "::notice title=Host nao configurado::As imagens foram publicadas, mas nenhum destino esta ligado. Veja docs/deploy.md para plugar Azure Container Apps, App Service, Fly.io ou Render."

      # --- Azure Container Apps -------------------------------------------------
      # Requer: secret AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
      #         (credencial federada OIDC - o equivalente a Service Connection do ADO)
      #
      # - uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #
      # - uses: azure/container-apps-deploy-action@v2
      #   with:
      #     resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      #     containerAppName: ${{ vars.AZURE_CONTAINER_APP }}
      #     imageToDeploy: ghcr.io/${{ github.repository }}/web:${{ needs.publish.outputs.image-tag }}

      # --- Azure App Service (container) ---------------------------------------

# Duas maneiras de usar este arquivo:
#
#   docker compose up -d postgres     -> so o banco, para rodar API e front na mao.
#                                         No Windows o LocalDB do Visual Studio ja
#                                         atende e nem isto e necessario.
#
#   docker compose --profile full up --build
#                                      -> a pilha inteira como em producao:
#                                         nginx serve o Angular e faz proxy de /api
#                                         para a API, tudo na mesma origem.
#                                         Abra http://localhost:8080
#
# Rodar o perfil "full" antes de um deploy e a forma mais barata de descobrir que
# um Dockerfile quebrou - o mesmo build roda no CI.

services:
  postgres:
    image: postgres:16-alpine
    container_name: controle-gastos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Dev@Password123
      POSTGRES_DB: controledegastos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d controledegastos",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: controle-gastos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # O duplo sublinhado e como o .NET mapeia hierarquia de configuracao para
      # variavel de ambiente: ConnectionStrings__Database == ConnectionStrings:Database.
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=controledegastos;Username=postgres;Password=Dev@Password123"
      # Aqui ligado por conveniencia local. Em producao as migrations sao um passo
      # explicito do pipeline - ver docs/deploy.md.
      Database__AutoMigrate: "true"
      Banking__Pluggy__UseFakeProvider: "true"
    expose:
      - "8080"


  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: controle-gastos-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: "http://api:8080"
      NGINX_PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  postgres-data:

# Template processado pelo entrypoint do nginx: ${API_UPSTREAM} e ${NGINX_PORT}
# sao substituidos na subida do container.

server {
    listen       ${NGINX_PORT};
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip nos arquivos que o Angular gera; o bundle inicial cai para ~1/3.
    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # A API na MESMA origem do front. E isto que faz environment.ts de producao
    # funcionar com apiBaseUrl: '/api' e dispensa CORS por completo.
    location /api/ {
        proxy_pass         ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # O sync bancario pode demorar; o default de 60s cortaria a resposta.
        proxy_read_timeout 120s;
    }

    # Health do proprio front, para o orquestrador saber que o nginx subiu.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Os arquivos com hash no nome sao imutaveis: cache longo e seguro.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA: qualquer rota do Angular (/lancamentos, /ajustes...) devolve o index,
    # senao um F5 fora da raiz daria 404. Precisa vir DEPOIS das regras acima.
    location / {
        try_files $uri $uri/ /index.html;

        # O index nao pode ser cacheado, senao o navegador continua pedindo os
        # bundles da versao anterior depois de um deploy.
        add_header Cache-Control "no-cache";
    }
}
